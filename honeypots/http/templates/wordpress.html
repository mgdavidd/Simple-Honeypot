<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In &lsaquo; WordPress</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .wp-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .wp-header .logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: bold;
        }
        .wp-header h1 {
            font-size: 22px;
            font-weight: 600;
            color: #1d2327;
            margin-bottom: 8px;
        }
        .wp-header p {
            font-size: 12px;
            color: #646970;
        }
        .login-form {
            margin-top: 20px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #1d2327;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #8c8f94;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .form-group input::placeholder {
            color: #a0a5aa;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }
        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
        }
        .submit-btn:active {
            transform: translateY(0);
        }
        .error-notice {
            background: #fff8f7;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            padding: 12px 14px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #721c24;
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }
        .error-notice::before {
            content: "⚠";
            flex-shrink: 0;
            font-weight: bold;
        }
        .login-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
            color: #646970;
        }
        .login-footer a {
            color: #667eea;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        .login-footer a:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        .back-link {
            text-align: center;
            margin-top: 16px;
            font-size: 12px;
        }
        .back-link a {
            color: #646970;
            text-decoration: none;
        }
        .back-link a:hover {
            color: #667eea;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="wp-header">
        <div class="logo">W</div>
        <h1>WordPress</h1>
        <p>Administration Dashboard</p>
    </div>

    {% if error %}
    <div class="error-notice">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/wp-login.php" class="login-form">
        <div class="form-group">
            <label for="user_login">Username or Email</label>
            <input 
                type="text" 
                name="log" 
                id="user_login" 
                placeholder="Enter your username or email"
                autocomplete="username"
                autofocus
                required
            >
        </div>

        <div class="form-group">
            <label for="user_pass">Password</label>
            <input 
                type="password" 
                name="pwd" 
                id="user_pass" 
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >
        </div>

        <button type="submit" class="submit-btn">Sign In</button>
        <input type="hidden" name="redirect_to" value="/wp-admin/">
    </form>

    <div class="login-footer">
        <a href="#">Lost your password?</a>
    </div>

    <div class="back-link">
        ← <a href="/">Back to site</a>
    </div>
</div>

</body>
</html>
