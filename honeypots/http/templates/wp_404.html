<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Page not found &#8212; WordPress</title>
<style>
* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f0f1; color: #3c434a; margin: 0; padding: 40px 20px; }
.wp-die-container { max-width: 500px; margin: 60px auto; background: #fff; border: 1px solid #c3c4c7; padding: 30px; }
.wp-die-container h1 { font-size: 20px; color: #1d2327; margin: 0 0 12px; }
.wp-die-container p { font-size: 14px; line-height: 1.6; }
.wp-die-container a { color: #2271b1; }
</style>
</head>
<body>
<div class="wp-die-container">
  <h1>Not Found</h1>
  <p>The page you are looking for could not be found. It may have been moved or deleted.</p>
  <p><a href="/wp-admin/">&larr; Back to Dashboard</a></p>
</div>
</body>
</html>
