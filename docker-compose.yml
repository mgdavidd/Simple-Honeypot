version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: honeypot
      POSTGRES_PASSWORD: honeypot
      POSTGRES_DB: honeypot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - honeypot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honeypot"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - honeypot-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "5555:5555"
    networks:
      - honeypot-net
    depends_on:
      - api
    environment:
      VITE_API_URL: http://api:8000

networks:
  honeypot-net:
    driver: bridge

volumes:
  postgres_data: